<h1>配置说明</h1>
<p>MoonPress 通过 front matter 读取页面级配置。</p>
<h2>页面字段</h2>
<ul>
  <li><code>title</code>：页面标题，用于导航、HTML 标题和搜索索引。</li>
  <li><code>description</code>：页面简介，用于搜索索引和后续元数据。</li>
  <li><code>order</code>：导航和上一篇/下一篇的排序值。</li>
  <li><code>draft</code>：设为 <code>true</code> 时跳过该页面。</li>
  <li><code>lang</code>：页面语言，英文为 <code>en</code>，中文为 <code>zh</code>。</li>
</ul>
