name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: moon check
        shell: pwsh
        run: moon check

      - name: moon fmt --deny-warn
        shell: pwsh
        run: |
          $output = moon fmt --deny-warn 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $text = ($output | Out-String)
            if ($text.Contains("unexpected argument") -or $text.Contains("Usage: moon.exe fmt")) {
              moon fmt --check
            } else {
              exit $code
            }
          }

      - name: moon info --deny-warn
        shell: pwsh
        run: |
          $output = moon info --deny-warn 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $text = ($output | Out-String)
            if ($text.Contains("unexpected argument") -or $text.Contains("Usage: moon.exe info")) {
              moon info
            } else {
              exit $code
            }
          }

      - name: Verify generated interfaces
        shell: pwsh
        run: git diff --exit-code -- src/pkg.generated.mbti src/cmd/moonpress/pkg.generated.mbti

      - name: moon test
        shell: pwsh
        run: moon test

      - name: Build sample site
        shell: pwsh
        run: moon run src/cmd/moonpress

