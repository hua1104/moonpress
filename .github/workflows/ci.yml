name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        uses: moonbitlang/setup-moonbit@v1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check formatting
        run: moon fmt --check

      - name: Check warnings
        run: moon check --deny-warn

      - name: Run MoonBit tests
        run: moon test --deny-warn

      - name: Verify generated interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code -- src/pkg.generated.mbti src/cmd/moonpress/pkg.generated.mbti

      - name: Build CLI
        run: moon build --target js src/cmd/moonpress

      - name: Run CLI integration tests
        run: node --test tests/cli.integration.test.mjs
